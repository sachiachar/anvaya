# The guardian's policy (PR-2.7.3): which response each risk level gets, for each action.
# Reviewed like code. Design: docs/architecture.md (the guardian core).
#
# Risk levels, from lowest: none, low, medium, high (a detector returns one, with a reason).
# Responses, from mildest: continue, add_check, reduce_autonomy, deflect, pause, block.
#   continue         the action goes ahead
#   add_check        it goes ahead, and a risk reviewer looks at it afterwards
#   reduce_autonomy  it goes ahead with less freedom (for example, an answer without tools)
#   deflect          nothing is made of it (no card), and the conversation turns to the safe route
#   pause            it waits for a risk reviewer (part 2: held, and the owner is alerted)
#   block            it doesn't happen
#
# A rule fixed in code can only make a response stricter: some detectors set a floor (for example,
# a next step that could be part of a fraud is always blocked). This file can never let through
# something the code forbids.
#
# Actions: next_step, model_call, review_confirmation, certificate_check, keep_card,
# recipient_change, release, family_question, owner_statement, family_answer. Each lists only the levels where it differs from
# the default.

version: 1

default: {none: continue, low: continue, medium: add_check, high: pause}

actions:
  next_step: {high: block}
  model_call: {}
  review_confirmation: {}
  certificate_check: {}
  # Part 2: these ask before they happen, and obey.
  keep_card: {high: block}        # Vikram keeps a card
  recipient_change: {}            # Vikram changes who receives the vault (high: pause, medium: add a check)
  release: {}                     # the vault opens after the waiting period (high: pause)
  family_question: {high: block}  # Priya asks the family's assistant
  # Guardian-led conversations: each new piece of information the owner gives, before any card.
  owner_statement: {high: deflect}
  # The family's assistant's answer, before it's shown (PR-2.12.4): replaced only if it would help
  # pass on a secret or pay someone who asked.
  family_answer: {high: block}
