# Agent registry: every agent that calls a model, with its one role, autonomy level,
# allowed models and tools, limits and budget pool. Reviewed like code.
#
# Limits the gateway enforces (PR-10.2):
#   max_input_tokens         estimated before the call; larger requests are refused
#   max_output_tokens        sent with the request, so the model stops there
#   max_retries              retries after the first attempt, then one try on the fallback model
#   max_model_calls_per_run  model calls in one ADK run (handover agent) or one fraud run (cost cap)
#   max_call_minutes         length of one live call
#   max_characters           length of one spoken reply
#
# thinking (optional, beside limits): how much the model may think, minimal, low, medium or high.
# Thinking counts toward max_output_tokens, so an agent whose answers are long thinks less.
#
# The platform admin portal (PR-12) shows this file. The agent gateway (PR-10.1) will
# enforce it: a call with a model or tool not listed here is refused and recorded.
# Design: docs/proposals/agent-governance.md §2.

version: 1

# Daily allowance per person for each budget pool (PR-10.4). Every agent belongs to one
# pool (its budget_class). Voice counts minutes, spoken replies count replies, and the
# rest count tokens (in + out). Pools not listed here (safety, platform) have no
# per-person limit: certificate checks and the guardian always run.
# Approved requests in the platform admin portal add to these until they expire.
allowances:
  owner: {tokens_per_day: 300000, voice_minutes_per_day: 30, spoken_replies_per_day: 50}
  family: {tokens_per_day: 200000}

agents:
  - id: saathi.chat
    role: Typed or photo conversation with the owner
    autonomy: act_within_limits
    models: {primary: gemini-3.1-flash-lite, fallback: [gemini-3.5-flash-lite]}
    tools: []
    limits: {max_input_tokens: 20000, max_output_tokens: 4000, max_retries: 2}
    budget_class: owner
    safety_critical: false

  - id: saathi.voice
    role: Live voice conversation with the owner
    autonomy: act_within_limits
    models: {primary: gemini-3.8-live, fallback: []}
    tools: []
    limits: {max_call_minutes: 20}
    budget_class: owner
    safety_critical: false
    optional: true        # paused first by the kill switch

  - id: saathi.speech
    role: Speaks Saathi's own replies aloud
    autonomy: act_within_limits
    models: {primary: gemini-3.8-flash-lite-tts, fallback: [gemini-3.8-flash-tts, gemini-3.1-flash-tts-preview]}
    tools: []
    limits: {max_characters: 1000}
    budget_class: owner
    safety_critical: false
    optional: true        # paused first by the kill switch

  - id: capture.extractor
    role: Turns each exchange into suggestion cards
    autonomy: propose
    models: {primary: gemini-3.1-flash-lite, fallback: [gemini-3.5-flash-lite]}
    tools: []
    limits: {max_input_tokens: 12000, max_output_tokens: 4000, max_retries: 2}
    budget_class: owner
    safety_critical: false

  - id: saathi.summary
    role: Sums up one conversation in a few sentences when it ends
    autonomy: assist
    models: {primary: gemini-3.1-flash-lite, fallback: [gemini-3.5-flash-lite]}
    tools: []
    limits: {max_input_tokens: 12000, max_output_tokens: 600, max_retries: 2}
    budget_class: owner
    safety_critical: false
    optional: true        # paused first by the kill switch

  - id: documents.reader
    role: Reads a policy or statement photo into an account card
    autonomy: propose
    models: {primary: gemini-3.1-flash-lite, fallback: [gemini-3.5-flash-lite]}
    tools: []
    limits: {max_input_tokens: 8000, max_output_tokens: 2000, max_retries: 2}
    budget_class: owner
    safety_critical: false

  - id: readiness.planner
    role: Next steps and the most important gap to ask about
    autonomy: propose
    models: {primary: gemini-3.1-flash-lite, fallback: [gemini-3.5-flash-lite]}
    tools: []
    limits: {max_input_tokens: 30000, max_output_tokens: 4000, max_retries: 2}
    budget_class: owner
    safety_critical: false

  - id: legal.needs
    role: Finds wishes that need a legal document
    autonomy: propose
    models: {primary: gemini-3.1-flash-lite, fallback: [gemini-3.5-flash-lite]}
    tools: []
    limits: {max_input_tokens: 20000, max_output_tokens: 2000, max_retries: 2}
    budget_class: owner
    safety_critical: false

  - id: activation.checker
    role: Pre-checks certificates and proof of authority
    autonomy: assist
    models: {primary: gemini-3.1-flash-lite, fallback: [gemini-3.5-flash-lite]}
    tools: []             # the fraud reference guide is given in its instructions (PR-2.3.4)
    limits: {max_input_tokens: 8000, max_output_tokens: 2000, max_retries: 2}
    budget_class: safety
    safety_critical: true

  - id: handover.assistant
    role: Answers the family's questions from kept knowledge, citing sources
    autonomy: act_within_limits
    models: {primary: gemini-3.1-flash-lite, fallback: [gemini-3.5-flash-lite]}
    tools: [read_bundle_index, read_concept, list_accounts]   # PR-7.5: reads the kept-knowledge bundle
    limits: {max_input_tokens: 60000, max_output_tokens: 1500, max_model_calls_per_run: 6, max_retries: 2}
    budget_class: family
    safety_critical: false

  - id: settlement.planner
    role: Claims checklist and draft letters
    autonomy: propose
    models: {primary: gemini-3.1-flash-lite, fallback: [gemini-3.5-flash-lite]}
    tools: []
    limits: {max_input_tokens: 30000, max_output_tokens: 8000, max_retries: 2}
    budget_class: family
    safety_critical: false

  - id: guardian.detectors
    role: Pressure, probing, synthetic audio and hidden-instruction signals
    autonomy: assist
    models: {primary: gemini-3.1-flash-lite, fallback: []}
    tools: []
    limits: {max_input_tokens: 8000, max_output_tokens: 1000, max_retries: 1}
    budget_class: safety
    safety_critical: true

  - id: fraud.researcher
    role: Checks imagined scenarios and new fraud tactics against cited sources
    autonomy: propose
    models: {primary: gemini-3.8-flash, fallback: [gemini-3.5-flash-lite]}
    tools: [web_search]      # the only agent with web access (Exa, web_search.py); saving drafts is our own code
    thinking: low            # it reads pages and copies sentences; thinking had used up its output cap (#129)
    limits: {max_input_tokens: 8000, max_output_tokens: 2000, max_new_patterns_per_run: 2, max_model_calls_per_run: 6, max_retries: 1}
    budget_class: platform
    safety_critical: false

  - id: fraud.dreamer
    role: Imagines attacks on our safeguards and maps which one catches each
    autonomy: propose
    models: {primary: gemini-3.8-flash, fallback: [gemini-3.5-flash-lite]}
    tools: []                # no web access: it imagines from our own guide, safeguards and events
    thinking: low            # its answers are long lists of scenarios; leave the output cap for them (#129)
    limits: {max_input_tokens: 12000, max_output_tokens: 4000, max_scenarios_per_sequence: 3, max_sequences_per_run: 2,
             max_model_calls_per_run: 8, max_retries: 1}
    budget_class: platform
    safety_critical: false

  - id: access.tester
    role: Tests a person's own model key before it's saved, with one tiny call per model (PR-10.10)
    autonomy: assist
    # Every model the person's key might be used for: chat and handover, fraud research, live
    # voice and spoken replies. Each test call uses only the key being tested, never ours.
    models: {primary: gemini-3.1-flash-lite, fallback: [gemini-3.8-flash, gemini-3.8-live, gemini-3.8-flash-lite-tts,
                                                        gemini-3.8-flash-tts, gemini-3.1-flash-tts-preview]}
    tools: []
    limits: {max_input_tokens: 100, max_output_tokens: 16, max_retries: 0}
    budget_class: platform
    safety_critical: false
