# Agent registry: what each agent IS. Its identity, purpose, how it's built and which models
# it tries, in order. Also the catalogue of every model and tool that exists. Reviewed like code.
#
# What each agent MAY DO (its role and autonomy, allowed models and tools, limits and budget
# pool) is in policies.yaml, reviewed separately. Design: docs/architecture.md §8.
# Both files are checked against a strict schema when the API starts (governance/core.py), and
# each agent here must have exactly one policy there.
#
# The platform admin portal (PR-12) shows both files. The gateway (PR-10.1) refuses a call
# from an agent that isn't here and active, or with a model or tool its policy doesn't allow.

version: 2

# Every model any agent may call. A model an agent tries, or a policy allows, must be listed.
models:
  - {id: gemini-3.1-flash-lite, kind: text}
  - {id: gemini-3.5-flash-lite, kind: text}
  - {id: gemini-3.8-flash, kind: text}
  - {id: gemini-3.8-live, kind: live}
  - {id: gemini-3.8-flash-lite-tts, kind: speech}
  - {id: gemini-3.8-flash-tts, kind: speech}
  - {id: gemini-3.1-flash-tts-preview, kind: speech}

# Every tool any agent may be given. effect: read (inside Anvaya), write, or external (reaches
# outside Anvaya). data: what it can see.
tools:
  - {id: read_bundle_index, kind: function, effect: read, data: owner_bundle_after_release}   # PR-7.5
  - {id: read_concept, kind: function, effect: read, data: owner_bundle_after_release}
  - {id: list_accounts, kind: function, effect: read, data: owner_bundle_after_release}
  - {id: web_search, kind: function, effect: external, data: none}   # Exa, web_search.py; never owner data
  - {id: current_step, kind: function, effect: read, data: conversation_plan}    # PR-2.12.3: the plan's current step
  - {id: report_step, kind: function, effect: write, data: conversation_plan}    # how the owner answered it
  - {id: voice_joined, kind: function, effect: write, data: conversation_plan}   # PR-2.13.2: Saathi heard another voice

mcp_servers: []          # none yet; each will list its endpoint and tools

# kind: model_step (one call through gemini.generate_json), adk_agent, live (a voice call) or
#       speech (spoken replies).
# status: active, or planned (registered, not built yet). Only an active agent may call a model.
# models: the order the agent tries them, primary first. The model actually used comes from
#         here, never from an environment variable.
# safety_critical: keeps running when the kill switch pauses everything else.
# optional: paused first by the kill switch.
agents:
  - id: saathi.chat
    purpose: Typed or photo conversation with the owner
    owner: team-saathi
    status: active
    kind: model_step
    models: {primary: gemini-3.1-flash-lite, fallback: [gemini-3.5-flash-lite]}
    safety_critical: false

  - id: saathi.voice
    purpose: Live voice conversation with the owner
    owner: team-saathi
    status: active
    kind: live
    models: {primary: gemini-3.8-live, fallback: []}
    safety_critical: false
    optional: true

  - id: saathi.speech
    purpose: Speaks Saathi's own replies aloud
    owner: team-saathi
    status: active
    kind: speech
    models: {primary: gemini-3.8-flash-lite-tts, fallback: [gemini-3.8-flash-tts, gemini-3.1-flash-tts-preview]}
    safety_critical: false
    optional: true

  - id: capture.extractor
    purpose: Turns each exchange into suggestion cards
    owner: team-saathi
    status: active
    kind: model_step
    models: {primary: gemini-3.1-flash-lite, fallback: [gemini-3.5-flash-lite]}
    safety_critical: false

  - id: saathi.summary
    purpose: Sums up one conversation in a few sentences when it ends
    owner: team-saathi
    status: active
    kind: model_step
    models: {primary: gemini-3.1-flash-lite, fallback: [gemini-3.5-flash-lite]}
    safety_critical: false
    optional: true

  - id: documents.reader
    purpose: Reads a policy or statement photo into an account card
    owner: team-saathi
    status: active
    kind: model_step
    models: {primary: gemini-3.1-flash-lite, fallback: [gemini-3.5-flash-lite]}
    safety_critical: false

  - id: readiness.planner
    purpose: Next steps and the most important gap to ask about
    owner: team-saathi
    status: active
    kind: model_step
    models: {primary: gemini-3.1-flash-lite, fallback: [gemini-3.5-flash-lite]}
    safety_critical: false

  - id: legal.needs
    purpose: Finds wishes that need a legal document
    owner: team-saathi
    status: active
    kind: model_step
    models: {primary: gemini-3.1-flash-lite, fallback: [gemini-3.5-flash-lite]}
    safety_critical: false

  - id: activation.checker
    purpose: Pre-checks certificates and proof of authority
    owner: team-saathi
    status: active
    kind: model_step
    models: {primary: gemini-3.1-flash-lite, fallback: [gemini-3.5-flash-lite]}
    safety_critical: true

  - id: handover.assistant
    purpose: Answers the family's questions from kept knowledge, citing sources
    owner: team-saathi
    status: active
    kind: adk_agent
    models: {primary: gemini-3.1-flash-lite, fallback: [gemini-3.5-flash-lite]}
    safety_critical: false

  - id: settlement.planner
    purpose: Claims checklist and draft letters
    owner: team-saathi
    status: active
    kind: model_step
    models: {primary: gemini-3.1-flash-lite, fallback: [gemini-3.5-flash-lite]}
    safety_critical: false

  - id: guardian.detectors
    purpose: Pressure, probing, synthetic audio and hidden-instruction signals
    owner: team-saathi
    status: planned          # no code calls a model as this agent yet
    kind: model_step
    models: {primary: gemini-3.1-flash-lite, fallback: []}
    safety_critical: true

  - id: fraud.researcher
    purpose: Checks imagined scenarios and new fraud tactics against cited sources
    owner: team-saathi
    status: active
    kind: model_step
    models: {primary: gemini-3.8-flash, fallback: [gemini-3.5-flash-lite]}
    safety_critical: false

  - id: fraud.dreamer
    purpose: Imagines attacks on our safeguards and maps which one catches each
    owner: team-saathi
    status: active
    kind: model_step
    models: {primary: gemini-3.8-flash, fallback: [gemini-3.5-flash-lite]}
    safety_critical: false

  - id: access.tester
    purpose: Tests a person's own model key before it's saved, with one tiny call per model (PR-10.10)
    owner: team-saathi
    status: active
    kind: model_step
    # It calls each model it tests directly; which ones it may test is in its policy.
    models: {primary: gemini-3.1-flash-lite, fallback: []}
    safety_critical: false
