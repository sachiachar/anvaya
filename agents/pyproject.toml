[project]
name = "life-after-agents"
version = "0.1.0"
description = "AI-first legacy and estate-settlement agents for Anvaya (AI Builder Cup 2026)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "pydantic>=2.13.5",
    "google-genai>=2.28.0",
    "google-adk>=2.11.0",
    "google-cloud-firestore>=2.34.0",
    "google-cloud-kms>=3.18.0",
    "google-cloud-storage>=3.16.0",
    "google-auth>=2.59.1",
    "pyyaml>=6.0.3",
    "google-cloud-bigquery>=3.46.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# Matches the existing style; there is no formatter, so lines aren't rewrapped.
line-length = 130
target-version = "py314"

[tool.ruff.lint]
# Bugs, not style: pyflakes, pycodestyle errors, bugbear, async and pylint errors.
select = ["F", "E", "W", "B", "ASYNC", "PLE"]
# FastAPI's Depends()/File() defaults are calls by design.
ignore = ["B008"]
