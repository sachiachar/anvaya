[project]
name = "life-after-agents"
version = "0.1.0"
description = "AI-first legacy and estate-settlement agents for Anvaya (AI Builder Cup 2026)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "google-genai>=2.0",
    "google-adk>=2.0",
    "google-cloud-firestore>=2.19",
    "google-cloud-kms>=3.0",
    "google-cloud-storage>=2.18",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "httpx2>=2.13.1",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# Matches the existing style; there is no formatter, so lines aren't rewrapped.
line-length = 130
target-version = "py312"

[tool.ruff.lint]
# Bugs, not style: pyflakes, pycodestyle errors, bugbear, async and pylint errors.
select = ["F", "E", "W", "B", "ASYNC", "PLE"]
# FastAPI's Depends()/File() defaults are calls by design.
ignore = ["B008"]
