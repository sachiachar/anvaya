[project]
name = "life-after-agents"
version = "0.1.0"
description = "AI-first legacy and estate-settlement agents for Anvaya (AI Builder Cup 2026)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "google-genai>=2.0",
    "google-adk>=2.0",
    "google-cloud-firestore>=2.19",
    "google-cloud-kms>=3.0",
    "google-cloud-storage>=2.18",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "httpx2>=2.13.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
