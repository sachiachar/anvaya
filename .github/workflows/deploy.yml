# Deploys what changed on main since each part last deployed successfully:
#   agents/**                                  -> tests, then the API to Cloud Run
#   web/**, firebase.json, firestore.rules     -> the web app and the Firestore rules
# Each part compares against the commit of its own last successful deploy, not just
# the previous push, so a release that was cancelled (a newer merge arrived while it
# waited) or skipped never loses changes. Docs-only changes deploy nothing. "Run workflow" (manual) deploys everything,
# or only the allowlist.
#
# Who may use the demo lives in GitHub: environment "production" -> secret
# ALLOWED_EMAILS (emails and/or @domains, comma-separated), and variable OPEN_SIGN_IN
# ("true" lets any Google account in, for judging, PR-15.2). One of the two must be set.
# Every API deploy applies both; to apply a change right away: Actions -> Deploy ->
# Run workflow -> "allowlist".
#
# Google credentials come from Workload Identity Federation (no stored keys);
# see infra/setup-github-actions.sh. Google gives them only to this workflow file, running on
# main, in environment "production", so every job that signs in to Google must use that
# environment (a test checks it). Service settings (env vars, secrets) are kept as they are;
# infra/deploy.sh manages them.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [all, allowlist]
        default: all

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  actions: read  # to find each part's last successful deploy

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # Manual runs follow the chosen target; pushes follow what changed.
      api: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'all' || github.event_name == 'push' && steps.api.outputs.changed == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'all' || github.event_name == 'push' && steps.web.outputs.changed == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # compare against older commits
      - name: Find each part's last successful deploy
        if: github.event_name == 'push'
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each part's last deploy is its most recently *finished* successful job among the
          # recent runs on main (pushed or manual), so re-running an old run counts as the
          # latest deploy of that older commit.
          runs=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=main&per_page=50" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | "\(.id) \(.head_sha)"')
          jobs=$(while read -r id head; do
            gh api "repos/${{ github.repository }}/actions/runs/$id/jobs" \
              --jq ".jobs[] | select(.conclusion == \"success\") | \"\(.name) \(.completed_at) $head\""
          done <<< "$runs")
          for part in api web; do
            sha=$(echo "$jobs" | awk -v p="$part" '$1 == p' | sort -k2 | tail -n 1 | cut -d' ' -f3)
            echo "$part last deployed at: ${sha:-never (deploying it now)}"
            echo "$part=$sha" >> "$GITHUB_OUTPUT"
          done
      - name: Did the API change since then?
        if: github.event_name == 'push'
        id: api
        run: |
          base="${{ steps.last.outputs.api }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --quiet "$base" HEAD -- agents; then echo "changed=false"; else echo "changed=true"; fi >> "$GITHUB_OUTPUT"
      - name: Did the web app or Firestore rules change since then?
        if: github.event_name == 'push'
        id: web
        run: |
          base="${{ steps.last.outputs.web }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --quiet "$base" HEAD -- web firebase.json firestore.rules; then echo "changed=false"; else echo "changed=true"; fi >> "$GITHUB_OUTPUT"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check who may sign in is set
        env:
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          OPEN_SIGN_IN: ${{ vars.OPEN_SIGN_IN }}
        run: '[ -n "$ALLOWED_EMAILS" ] || [ "$OPEN_SIGN_IN" = "true" ] || { echo "Set ALLOWED_EMAILS, or OPEN_SIGN_IN=true, in environment production"; exit 1; }'

      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Tests
        working-directory: agents
        run: uv run --group dev pytest -q
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy API to Cloud Run
        env:
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          # "true": any Google account may sign in, each to its own demo copy (PR-15.2). A variable
          # in environment "production", not a secret. Empty or anything else: only ALLOWED_EMAILS.
          OPEN_SIGN_IN: ${{ vars.OPEN_SIGN_IN }}
          # Platform admin portal roles, e.g. "you@example.com:platform_admin,@team.com:risk_reviewer".
          # Anyone else allowed in is a read-only viewer.
          PLATFORM_ROLES: ${{ secrets.PLATFORM_ROLES }}
          # The Cloud Billing export the portal reads actual spend from, as project.dataset.
          # A repository variable, not a secret. Empty: the portal says billing isn't available yet.
          BILLING_EXPORT_TABLE: ${{ vars.BILLING_EXPORT_TABLE }}
          # Exa web search for the fraud research agent (agents/app/web_search.py). A secret in
          # environment "production". Empty: fraud research says web search isn't set up yet.
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          # The KMS key that encrypts model keys people add themselves (PR-10.10; agents/app/governance/keys.py).
          # A repository variable, not a secret. Empty: people can't save their own key; everything else works.
          MODEL_KEYS_KMS_KEY_NAME: ${{ vars.MODEL_KEYS_KMS_KEY_NAME }}
        # --cpu-boost: extra CPU while an instance starts and for 10 seconds after, so cold starts are
        # shorter. The extra CPU is billed only for those seconds.
        run: |
          gcloud run deploy life-after-agents --source agents \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --quiet --cpu-boost \
            --update-env-vars "^;^ALLOWED_EMAILS=${ALLOWED_EMAILS};OPEN_SIGN_IN=${OPEN_SIGN_IN:-false};PLATFORM_ROLES=${PLATFORM_ROLES};BILLING_EXPORT_TABLE=${BILLING_EXPORT_TABLE};EXA_API_KEY=${EXA_API_KEY};MODEL_KEYS_KMS_KEY_NAME=${MODEL_KEYS_KMS_KEY_NAME}"

  allowlist:
    # Manual only: apply the allowlist and open sign-in without rebuilding anything.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'allowlist'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Update who may sign in on Cloud Run
        env:
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          OPEN_SIGN_IN: ${{ vars.OPEN_SIGN_IN }}
        run: |
          [ -n "$ALLOWED_EMAILS" ] || [ "$OPEN_SIGN_IN" = "true" ] || { echo "Set ALLOWED_EMAILS, or OPEN_SIGN_IN=true, in environment production"; exit 1; }
          gcloud run services update life-after-agents \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --quiet \
            --update-env-vars "^;^ALLOWED_EMAILS=${ALLOWED_EMAILS};OPEN_SIGN_IN=${OPEN_SIGN_IN:-false}"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    environment: production  # Google credentials are given only to this environment (#110)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web app
        working-directory: web
        env:
          VITE_LIVE_URL: ${{ vars.VITE_LIVE_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          npm ci
          npm run build
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          create_credentials_file: true
      # Always both, so a successful "web" job means the site and the rules match this commit.
      - name: Deploy to Firebase
        run: npx --yes firebase-tools@15.31.0 deploy --project "${{ vars.GCP_PROJECT_ID }}" --only hosting,firestore:rules --non-interactive
