# Deploys only what changed on each push to main:
#   agents/**                -> tests, then the API to Cloud Run
#   web/**, firebase.json    -> the web app to Firebase Hosting
#   firestore.rules          -> Firestore security rules
# Docs-only changes deploy nothing. "Run workflow" (manual) deploys everything,
# or only the allowlist.
#
# Who may use the demo lives in GitHub: environment "production" -> secret
# ALLOWED_EMAILS (emails and/or @domains, comma-separated). Every API deploy applies
# it; to apply a change right away: Actions -> Deploy -> Run workflow -> "allowlist".
#
# Google credentials come from Workload Identity Federation (no stored keys);
# see infra/setup-github-actions.sh. Service settings (env vars, secrets) are
# kept as they are; infra/deploy.sh manages them.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [all, allowlist]
        default: all

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # Manual runs follow the chosen target; pushes follow what changed.
      api: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'all' || github.event_name == 'push' && steps.filter.outputs.api == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'all' || github.event_name == 'push' && steps.filter.outputs.web == 'true' }}
      rules: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'all' || github.event_name == 'push' && steps.filter.outputs.rules == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            api:
              - 'agents/**'
            web:
              - 'web/**'
              - 'firebase.json'
            rules:
              - 'firestore.rules'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check the allowlist is set
        env:
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
        run: '[ -n "$ALLOWED_EMAILS" ] || { echo "Set ALLOWED_EMAILS in environment production"; exit 1; }'

      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Tests
        working-directory: agents
        run: uv run --group dev pytest -q
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy API to Cloud Run
        env:
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          # Platform admin portal roles, e.g. "you@example.com:platform_admin,@team.com:risk_reviewer".
          # Anyone else allowed in is a read-only viewer.
          PLATFORM_ROLES: ${{ secrets.PLATFORM_ROLES }}
        run: |
          gcloud run deploy life-after-agents --source agents \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --quiet \
            --update-env-vars "^;^ALLOWED_EMAILS=${ALLOWED_EMAILS};PLATFORM_ROLES=${PLATFORM_ROLES}"

  allowlist:
    # Manual only: apply the allowlist without rebuilding anything.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'allowlist'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Update the allowlist on Cloud Run
        env:
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
        run: |
          [ -n "$ALLOWED_EMAILS" ] || { echo "Set ALLOWED_EMAILS in environment production"; exit 1; }
          gcloud run services update life-after-agents \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" --quiet \
            --update-env-vars "^;^ALLOWED_EMAILS=${ALLOWED_EMAILS}"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web app
        if: needs.changes.outputs.web == 'true'
        working-directory: web
        env:
          VITE_LIVE_URL: ${{ vars.VITE_LIVE_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          npm ci
          npm run build
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          create_credentials_file: true
      - name: Deploy to Firebase
        run: |
          targets=""
          [ "${{ needs.changes.outputs.web }}" = "true" ] && targets="hosting"
          [ "${{ needs.changes.outputs.rules }}" = "true" ] && targets="${targets:+$targets,}firestore:rules"
          echo "Deploying: $targets"
          npx --yes firebase-tools@15.31.0 deploy --project "${{ vars.GCP_PROJECT_ID }}" --only "$targets" --non-interactive
