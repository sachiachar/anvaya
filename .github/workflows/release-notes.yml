# Every pull request that changes what people use (the app, the API, the admin portal, the agents'
# rules, hosting or the Firestore rules) adds its entry to docs/release-notes.md, so each release
# lists what went live. A change nobody can notice, such as a refactor or a test, takes the
# "no release note" label, and the PR says why.
name: Release notes

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The release notes have this change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'no release note') }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD)
          needs=$(echo "$changed" | grep -E '^(agents/app/|agents/(registry|policies)\.yaml|web/src/|web/public/|web/[^/]+\.html$|firebase\.json$|firestore\.rules$)' || true)
          if [ -z "$needs" ]; then echo "Nothing people use changed: no release note needed."; exit 0; fi
          if echo "$changed" | grep -qx 'docs/release-notes.md'; then echo "docs/release-notes.md is updated."; exit 0; fi
          if [ "$SKIP" = "true" ]; then echo "Labelled \"no release note\": skipped."; exit 0; fi
          echo "These files change what people use, but docs/release-notes.md has no entry:"
          echo "$needs" | sed 's/^/  /'
          echo "Add an entry under \"Not yet released\", or label the PR \"no release note\" and say why."
          exit 1
