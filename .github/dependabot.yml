# Weekly pull requests for outdated dependencies, grouped so there are few of them.
# Security fixes arrive straight away. Merging deploys, so read the CI result first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /agents
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-minor:
        update-types: [minor, patch]
    ignore:
      # FastAPI 0.142 needs OpenTelemetry 1.44, which google-adk 2.11 caps at 1.42.1, so every weekly
      # update failed. Remove this once ADK lifts the cap: a test in test_dependencies.py fails then.
      - dependency-name: fastapi
        versions: [">=0.142.0"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor:
        update-types: [minor, patch]
