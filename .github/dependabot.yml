# Weekly pull requests for outdated dependencies, grouped so there are few of them.
# Security fixes arrive straight away. Merging deploys, so read the CI result first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /agents
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor:
        update-types: [minor, patch]
