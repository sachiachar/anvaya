# Weekly pull requests for outdated dependencies, grouped so there are few of them.
# Security fixes arrive straight away. Merging deploys, so read the CI result first.
# Cooldown: a new release is proposed only once it's a few days old (a major after a week), so a
# bad or hijacked release that is pulled again soon never reaches us. Security updates don't wait.
# Major updates come on their own, so their release notes are read first (AGENTS.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3  # GitHub Actions takes days only, not per kind of update
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /agents
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      python-minor:
        update-types: [minor, patch]
    ignore:
      # FastAPI 0.142 needs OpenTelemetry 1.44, which google-adk 2.11 caps at 1.42.1, so every weekly
      # update failed. Remove this once ADK lifts the cap: a test in test_dependencies.py fails then.
      - dependency-name: fastapi
        versions: [">=0.142.0"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      npm-minor:
        update-types: [minor, patch]

  # The API's container images (agents/Dockerfile). This watches the uv image. The python image is
  # left out: Python moves by hand only, in every place at once (.python-version, pyproject.toml and
  # the Dockerfile; a test checks they agree).
  - package-ecosystem: docker
    directory: /agents
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 3  # Docker takes days only
    ignore:
      - dependency-name: python
