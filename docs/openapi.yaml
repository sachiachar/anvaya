openapi: 3.1.0
info:
  title: Anvaya agents
  version: 0.1.0
  description: |
    The Anvaya API: the app, the live call, the handover and the platform admin portal.
    All demo data is synthetic.

    ## Signing in
    - Every `/api` route needs a **Firebase ID token** from Google sign-in, as `Authorization: Bearer <token>`.
      Running locally with `AUTH_REQUIRED=false`, no token is needed.
    - Each signed-in account works on **its own demo copy**. A route with an `owner_id` refuses one that isn't
      the caller's copy.
    - `/api/platform` routes check the caller's **portal role** on the server: viewer, demo admin, budget
      approver, risk reviewer or platform admin. A demo admin sees and decides only their own copy's records.
    - `/api/healthz` is open. `/internal/fraud/cycle` takes only the Cloud Scheduler service account's
      Google-signed ID token.

    ## What the API never returns
    - Vault secrets in readable form: they are encrypted on the device, and the server holds only what it can't open.
    - Conversation text or names in `/api/platform` routes: people appear as hashed keys.

    ## Paged lists
    The `/api/platform` list routes (`…/events`, `…/entries`, `…/copies` and others) take `page`, `size`
    (20 by default, at most 100), `q` (every word must match, in any case), and `from` and `to` dates
    (`YYYY-MM-DD`, whole days in UTC). They return `items`, `page` (`page`, `size`, `total`, `pages`) and
    `choices`: each filter's values with how many rows have them.

    ## Errors
    Errors come as `{"detail": "..."}`.

    | Status | Meaning |
    | --- | --- |
    | 400 | The request can't be done as asked |
    | 401 | No sign-in, or the token isn't valid |
    | 403 | The role or the governance gateway refuses it, or the allowance is used up |
    | 404 | Not found, or not in the caller's demo copy |
    | 409 | It clashes with the current state, for example a second request while one waits |
    | 413 | The upload is too large |
    | 422 | A field is missing or not valid |
    | 502 | Gemini failed, or its answer didn't match the expected format |
    | 503 | A cloud service isn't set up or can't be reached |

    ## The live call (WebSocket)
    `GET /api/owners/{owner_id}/live?acting_as=vikram`, upgraded to a WebSocket. Browsers can't send headers
    on a WebSocket, and a token in the URL would be kept in request logs. So with sign-in on, the **first
    message** carries the token. Without it within 10 seconds, the call closes with code 4401.

    | Direction | Frame | Content |
    | --- | --- | --- |
    | app → server | text, first | `{"type": "auth", "token": "<Firebase ID token>"}` |
    | app → server | binary | 16 kHz mono 16-bit PCM from the microphone |
    | app → server | text | `{"type": "end"}` to hang up |
    | server → app | binary | 24 kHz mono 16-bit PCM, Saathi's voice |
    | server → app | text | `{"type": "ready"}`: the call is connected |
    | server → app | text | `{"type": "heard" or "said", "text"}`: live captions |
    | server → app | text | `{"type": "interrupted"}`: the owner started talking, so stop playback |
    | server → app | text | `{"type": "turn", "owner_turn", "assistant_turn"}`: after each exchange, with things to keep |
    | server → app | text | `{"type": "error", "detail"}` |
servers:
- url: https://anvaya-saathi.web.app
  description: Production, through Firebase Hosting to Cloud Run
- url: http://localhost:8080
  description: Local development
security:
- firebase: []
tags:
- name: Service
  description: Whether the service is up, and how it is set up.
- name: Scheduler
  description: Work that Cloud Scheduler starts, such as the hourly fraud cycle.
- name: Your demo copy
  description: 'The caller''s own demo copy: who they are, their allowance, their own model key, and starting again.'
- name: Voice check
  description: The owner's optional voice check. Only numbers that describe the voice are kept, never the recording.
- name: Vault and family
  description: Choosing who receives the vault, and the vault itself. Secrets arrive already encrypted on the device.
- name: Handover
  description: 'When the time comes: the death report, two reviewers, the waiting period, the release, and the family''s questions.'
- name: Wishes and legal
  description: Which wishes need a legal document, and the legal partner.
- name: Owner
  description: Talking to Saathi, keeping what matters, the plan, gaps and tasks.
- name: 'Admin portal: guardian'
  description: Each time the guardian stepped in, and whether it was right.
- name: 'Admin portal: fraud'
  description: The fraud reference guides, what the pipeline added, reviews and runs.
- name: 'Admin portal: agents and use'
  description: The agents, their use, spend and refused calls.
- name: 'Admin portal: people'
  description: Allowance requests, demo copies and people's own model keys.
- name: 'Admin portal: settings and audit'
  description: The caller's role, the kill switch, privacy settings and the audit log.
paths:
  /api/healthz:
    get:
      summary: Healthz
      operationId: healthz_api_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Healthz Api Healthz Get
      tags:
      - Service
      security: []
  /internal/fraud/cycle:
    post:
      summary: Fraud Cycle
      description: |-
        The hourly fraud cycle (Cloud Scheduler, scheduler.py). Outside /api: no person signs in here;
        only the scheduler's own service account, by its Google-signed ID token. The runs happen inside
        this request, so Cloud Run keeps the CPU on until they finish.
      operationId: fraud_cycle_internal_fraud_cycle_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Fraud Cycle Internal Fraud Cycle Post
      tags:
      - Scheduler
      security:
      - scheduler: []
  /api/demo/seed:
    post:
      summary: Seed Demo
      description: |-
        Reset the caller's own demo copy to the synthetic persona (PR-1.5). Never touches another
        copy. Never use real personal data in demos.
      operationId: seed_demo_api_demo_seed_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Seed Demo Api Demo Seed Post
      tags:
      - Your demo copy
  /api/owners/{owner_id}:
    get:
      summary: Get Owner
      operationId: get_owner_api_owners__owner_id__get
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
          title: Owner Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Owner Api Owners  Owner Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Owner
  /api/owners/{owner_id}/capture/audio:
    post:
      summary: Capture Audio
      operationId: capture_audio_api_owners__owner_id__capture_audio_post
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
          title: Owner Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_capture_audio_api_owners__owner_id__capture_audio_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Capture Audio Api Owners  Owner Id  Capture Audio Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Owner
  /api/owners/{owner_id}/conversation:
    get:
      summary: Get Conversation
      operationId: get_conversation_api_owners__owner_id__conversation_get
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
          title: Owner Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Conversation Api Owners  Owner Id  Conversation Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Owner
    post:
      summary: Converse
      description: |-
        One turn: the owner talks, types, or shares a photo or document. The AI replies,
        and anything worth keeping comes back as proposals the owner can keep or discard.
        Store and media calls run in worker threads, so one slow read doesn't hold up everyone else.
      operationId: converse_api_owners__owner_id__conversation_post
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
          title: Owner Id
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_converse_api_owners__owner_id__conversation_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Converse Api Owners  Owner Id  Conversation Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Owner
  /api/speech:
    post:
      summary: Speech Audio
      description: |-
        Spoken version of one of Saathi's replies, as a WAV file (PR-10.3).

        Only a reply Saathi actually gave can be spoken, never arbitrary text. The audio is
        saved and reused for the same words, so replaying a reply, or a reply that repeats
        earlier words, costs nothing.
      operationId: speech_audio_api_speech_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Speech'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Owner
