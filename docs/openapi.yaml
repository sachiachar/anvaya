    post:
      summary: Add Wish
      description: A wish the owner types is the owner's own action, so it is approved at once.
      operationId: add_wish_api_owners__owner_id__wishes_post
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
          title: Owner Id
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_add_wish_api_owners__owner_id__wishes_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Add Wish Api Owners  Owner Id  Wishes Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Owner
  /api/owners/{owner_id}/review:
    get:
      summary: Review Queue
      operationId: review_queue_api_owners__owner_id__review_get
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
          title: Owner Id
      responses:
