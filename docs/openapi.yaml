          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Owner
  /api/proposals/{doc_id}/decision:
    post:
      summary: Decide
      operationId: decide_api_proposals__doc_id__decision_post
      parameters:
      - name: doc_id
        in: path
        required: true
        schema:
          type: string
          title: Doc Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/app__main__Decision'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Decide Api Proposals  Doc Id  Decision Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Owner
  /api/owners/{owner_id}/archive:
    get:
      summary: Archive
      operationId: archive_api_owners__owner_id__archive_get
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
          title: Owner Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Archive Api Owners  Owner Id  Archive Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Owner
  /api/owners/{owner_id}/kept:
    get:
      summary: List Kept
      description: Everything the owner has kept, current versions only, so they can remove a mistake.
      operationId: list_kept_api_owners__owner_id__kept_get
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
          title: Owner Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Kept Api Owners  Owner Id  Kept Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Owner
  /api/owners/{owner_id}/kept/{item_id}:
    delete:
      summary: Remove Kept
      description: |-
        The owner removes something wrongly recorded: it and every earlier version are deleted from
        the bundle, so it never reaches the family. Only the owner, and not while a release case is
        open: then the bundle is what the reviewers and the family rely on.
      operationId: remove_kept_api_owners__owner_id__kept__item_id__delete
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
          title: Owner Id
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          title: Item Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Remove Kept Api Owners  Owner Id  Kept  Item Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Owner
  /api/owners/{owner_id}/knowledge-map:
    get:
      summary: Get Knowledge Map
      description: The owner's kept knowledge as a graph, for the demo's knowledge map (read-only).
      operationId: get_knowledge_map_api_owners__owner_id__knowledge_map_get
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
          title: Owner Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Knowledge Map Api Owners  Owner Id  Knowledge Map Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Owner
  /api/owners/{owner_id}/gaps:
    get:
      summary: Get Gaps
      description: |-
        What's missing, found by fixed rules (PR-7.10), most harmful first. Saathi may ask about
        the top two; the owner can skip any of them.
      operationId: get_gaps_api_owners__owner_id__gaps_get
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
          title: Owner Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Gaps Api Owners  Owner Id  Gaps Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Owner
  /api/owners/{owner_id}/gaps/{key}/skip:
    post:
      summary: Skip Gap
      description: 'The owner chose not to answer this one: Saathi never raises it again.'
      operationId: skip_gap_api_owners__owner_id__gaps__key__skip_post
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
          title: Owner Id
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Skip Gap Api Owners  Owner Id  Gaps  Key  Skip Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Owner
  /api/owners/{owner_id}/readiness:
    post:
      summary: Readiness
      description: 'Readiness loop: score, plus next steps that stay on the owner''s list until done.'
      operationId: readiness_api_owners__owner_id__readiness_post
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
          title: Owner Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Readiness Api Owners  Owner Id  Readiness Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Owner
  /api/owners/{owner_id}/plan:
    get:
      summary: Get Plan
      description: |-
        The conversation plan (PR-2.12.2): the current step, who starts it, and the next ones. The
        only source of what Saathi talks about; worked out on a cold start or when it's over an hour old.
      operationId: get_plan_api_owners__owner_id__plan_get
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
          title: Owner Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Plan Api Owners  Owner Id  Plan Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Owner
  /api/owners/{owner_id}/tasks:
    get:
      summary: List Tasks
      operationId: list_tasks_api_owners__owner_id__tasks_get
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
          title: Owner Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Tasks Api Owners  Owner Id  Tasks Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Owner
  /api/tasks/{task_id}:
    post:
      summary: Update Task
      operationId: update_task_api_tasks__task_id__post
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Update Task Api Tasks  Task Id  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Owner
  /api/owners/{owner_id}/conversation/prompt:
    post:
      summary: Companion Asks
      description: |-
        Start a topic from a next step: the companion's question appears in the chat,
        and the next typed message or live call carries on from it. The text comes from the app, so it
        gets the same checks as a next step (PR-13.3) and as anything Saathi says (no death words).
      operationId: companion_asks_api_owners__owner_id__conversation_prompt_post
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
          title: Owner Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prompt'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Companion Asks Api Owners  Owner Id  Conversation Prompt Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Owner
  /api/owners/{owner_id}/conversation/summary:
    post:
      summary: Summarize Conversation
      description: |-
        A few sentences that sum up a conversation that just ended. Shown, never stored or logged;
        numbers are masked in code, whatever the model wrote.
      operationId: summarize_conversation_api_owners__owner_id__conversation_summary_post
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
          title: Owner Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnIds'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Summarize Conversation Api Owners  Owner Id  Conversation Summary Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Owner
  /api/owners/{owner_id}/conversation/forget:
    post:
      summary: Forget Conversation
      description: |-
        The owner discards a conversation: its turns are deleted, with every card from it still
        waiting for Keep. Anything already kept stays: removing that is a separate, deliberate step
        (DELETE /kept). Saathi no longer carries on from what was deleted.
      operationId: forget_conversation_api_owners__owner_id__conversation_forget_post
      parameters:
      - name: owner_id
        in: path
        required: true
        schema:
          type: string
          title: Owner Id
      requestBody:
        required: true
